name: Deploy MkDocs to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # --strict aborts on a broken link or missing image instead of quietly
      # shipping it. It is the only gate between a push and the live site.
      #
      # --no-history squashes gh-pages to a single commit each deploy. The
      # built site carries ~20 MB of photos and firmware binaries, so keeping
      # history there would grow the repo by that much on every release.
      - run: mkdocs gh-deploy --force --strict --no-history
